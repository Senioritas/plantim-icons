name: Plantim Icons Release

on:
  push:
    tags:
      - "icons-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  swift:
    name: Validate Swift package
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test --package-path packages/PlantimIcons

  publish:
    name: Publish @plantim/icons
    needs: swift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm Trusted Publishing compatible CLI
        run: npm install --global npm@11.12.1

      - name: Verify npm CLI
        run: npm --version

      - run: npm ci

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const version = JSON.parse(fs.readFileSync("packages/plantim-icons/package.json", "utf8")).version;
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `icons-v${version}`) throw new Error(`Tag ${tag} does not match icons-v${version}`);
          '

      - name: Validate contract and public API
        run: |
          npm run icons:validate:node

      - name: Verify generated adapters are committed
        run: |
          git diff --exit-code -- \
            packages/plantim-icons/src \
            packages/plantim-icons/dist \
            packages/PlantimIcons/Sources

      - name: Publish with npm Trusted Publishing
        working-directory: packages/plantim-icons
        run: npm publish --provenance --access public
