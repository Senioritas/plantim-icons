name: Plantim Icons CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run icons:validate:node
      - run: npm run gallery:build
      - run: npx playwright install --with-deps chromium
      - run: npm run gallery:test
      - name: Verify generated adapters are committed
        run: |
          git diff --exit-code -- \
            packages/plantim-icons/src \
            packages/plantim-icons/dist \
            packages/PlantimIcons/Sources

  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: swift test --package-path packages/PlantimIcons
