name: Plantim Icons CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run the reproducible validation image
        run: |
          docker build --pull -f docker/ci/Dockerfile -t plantim-icons-ci:${GITHUB_SHA} .
          docker run --rm plantim-icons-ci:${GITHUB_SHA}

      - name: Upload Docker validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons-docker-validation-${{ github.run_id }}
          path: |
            docker/ci-artifacts
            /tmp/plantim-icons-ci
          if-no-files-found: ignore
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run icons:validate:node
      - run: npm run gallery:build
      - run: npx playwright install --with-deps chromium
      - run: npm run gallery:test
      - name: Verify generated adapters are committed
        run: |
          git diff --exit-code -- \
            packages/plantim-icons/src \
            packages/plantim-icons/dist \
            packages/PlantimIcons/Sources

      - name: Upload web parity evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons-web-parity-${{ github.run_id }}
          path: |
            gallery/web/test-results
            gallery/web/playwright-report
            design-tokens/icons/parity-fixtures.json
            docs/icon-visual-parity.md
          if-no-files-found: ignore
          retention-days: 14

  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path packages/PlantimIcons

      - name: Upload Swift parity evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: icons-ios-parity-${{ github.run_id }}
          path: |
            packages/PlantimIcons/.build
            packages/PlantimIcons/Tests
          if-no-files-found: ignore
          retention-days: 14
